<div class="card p-3 mb-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
    <div>
      <h6 class="fw-bold text-primary mb-0">📸 Evidencia Fotográfica en Tienda</h6>
      <small class="text-muted" style="font-size: 0.72rem;">Registra o actualiza las 2 fotos de los lotes obsoletos en sede.</small>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm fw-bold rounded-3" onclick="cargarDatos()">🔄 Actualizar lista</button>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-12 col-md-5">
      <select id="selSucursalFotos" class="form-select form-select-sm fw-bold" onchange="renderTablaFotos()">
        <option value="TODAS">Todas las sedes</option>
      </select>
    </div>
    <div class="col-12 col-md-7">
      <input type="text" id="txtBuscarFotos" class="form-control form-control-sm" placeholder="Filtrar por código o descripción..." oninput="renderTablaFotos()">
    </div>
  </div>

  <div id="panelEditorFotosAuditoria" class="border rounded-4 p-3 bg-light mb-3 d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <strong class="small text-dark" id="tituloLoteFotos">Lote seleccionado</strong>
      <button type="button" class="btn-close btn-sm" onclick="cerrarEditorFotosAuditoria()"></button>
    </div>

    <div class="row g-2 text-center mb-2">
      <div class="col-6">
        <div class="border rounded-3 p-2 bg-white">
          <span class="badge bg-dark mb-1">1. Foto Producto</span>
          <img id="audImg1" src="https://via.placeholder.com/250x180?text=Foto+1" class="img-fluid img-preview-aud d-block mx-auto mb-2" onclick="ampliarFoto(this.src)">
          <label class="btn btn-primary btn-sm w-100 fw-semibold rounded-3 mb-1">
            Subir / Móvil
            <input type="file" accept="image/*" capture="environment" hidden onchange="capturarFotoAuditoriaLocal(1, this)">
          </label>
          <button type="button" class="btn btn-outline-dark btn-sm w-100 fw-bold rounded-3" onclick="abrirCamaraWeb(1, 'FOTOS')">📷 Cámara USB / PC</button>
        </div>
      </div>
      <div class="col-6">
        <div class="border rounded-3 p-2 bg-white">
          <span class="badge bg-danger mb-1">2. Foto Caja / Estado</span>
          <img id="audImg2" src="https://via.placeholder.com/250x180?text=Foto+2" class="img-fluid img-preview-aud d-block mx-auto mb-2" onclick="ampliarFoto(this.src)">
          <label class="btn btn-danger btn-sm w-100 fw-semibold rounded-3 mb-1">
            Subir / Móvil
            <input type="file" accept="image/*" capture="environment" hidden onchange="capturarFotoAuditoriaLocal(2, this)">
          </label>
          <button type="button" class="btn btn-outline-dark btn-sm w-100 fw-bold rounded-3" onclick="abrirCamaraWeb(2, 'FOTOS')">📷 Cámara USB / PC</button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center gap-2">
      <div id="msgGuardadoFotosAud" class="small fw-bold text-success"></div>
      <button type="button" id="btnGuardarFotosLote" class="btn btn-success btn-sm fw-bold rounded-3 px-4" onclick="guardarFotosLoteAuditoria()">
        ☁️ Guardar Fotos
      </button>
    </div>
  </div>

  <div id="listaLotesFotos" class="d-flex flex-column gap-2"></div>
</div>
